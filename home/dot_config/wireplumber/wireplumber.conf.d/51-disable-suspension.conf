monitor.alsa.rules = [
  {
    matches = [
      {
        # Matches all output sinks
        node.name = "~alsa_output.*"
      },
      {
        # Matches all input sinks
        node.name = "~alsa_input.*"
      }
    ]
    actions = {
      update-props = {
        # 0 disables the suspend timeout entirely
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
