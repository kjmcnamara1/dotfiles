state_file = "auto"

# niri has no key-release binds, so use voxtype's built-in evdev hotkey
# (needs `input` group). Press Super+Ctrl+X to start dictating, press again to stop.
[hotkey]
enabled   = true
key       = "EVTEST_45" # KEY_X (voxtype has no plain letter names)
modifiers = ["LEFTMETA", "LEFTCTRL"]
mode      = "toggle"

[audio]
device = "default"
max_duration_secs = 60

[whisper]
model    = "base.en"
language = "en"
on_demand_loading = false  # streaming needs the model resident
streaming = true           # type words at the cursor while speaking

[output]
mode = "type"
