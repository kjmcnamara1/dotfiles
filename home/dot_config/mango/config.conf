# vim: ft=config
# More option see https://github.com/DreamMaoMao/mango/wiki/


# ░█▄█░█▀█░█▀█░▀█▀░▀█▀░█▀█░█▀▄░█▀▀
# ░█░█░█░█░█░█░░█░░░█░░█░█░█▀▄░▀▀█
# ░▀░▀░▀▀▀░▀░▀░▀▀▀░░▀░░▀▀▀░▀░▀░▀▀▀
# monitorrule = name    , mfact, nmaster, layout  , transform, scale, x   , y   , width, height, refreshrate
monitorrule   = HDMI-A-1, 1    , 1      , scroller, 0        , 1    , 2560, 0   , 1920 , 1080  , 60
monitorrule   = DP-1    , 1    , 1      , scroller, 0        , 1.5  , 0   , 1080, 3840 , 2160  , 59.997002
monitorrule   = DP-2    , 1    , 0      , scroller, 0        , 1.5  , 2560, 1080, 3840 , 2160  , 59.997002

exec = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=wlroots
exec = notify-send "Mango WC" "Reloading config"

exec-once = walker --gapplication-service
exec-once = swaybg -i ~/.cache/wallpaper/.current
# exec-once = waybar
# exec-once = hypridle
# exec-once = hyprsunset
# exec-once = mako

source = ./colors/nord.conf
source = ./apps/waybar.conf
source = ./apps/yazi.conf
source = ./apps/swayosd.conf

borderpx=4
border_radius=10
focused_opacity=1.0
unfocused_opacity=0.8

blur = 1
blur_layer = 1
blur_params_radius=20
blur_params_num_passes=3

shadows=1
shadows_size=10
shadows_blur=30
shadows_position_x=-8
shadows_position_y=0
shadowscolor=0x00000080

tag_animation_direction = 0 # Tag animation direction (1-horizontal, 0-vertical)


# Scroller Layout
scroller_default_proportion = 0.5 # Default width proportion for new windows
scroller_prefer_center = 0 # Center focused window only if it was outside the view
edge_scroller_pointer_focus = 0 # Focus windows even if partially off-screen.
scroller_proportion_preset = 0.333,0.5,0.667 # Presets for cycling window widths.
scroller_ignore_proportion_single = 0 # Ignore proportion adjustments for single windows.
scroller_default_proportion_single = 1.0 # Default proportion for single windows in scroller.

# Focus & Input
cursor_hide_timeout = 3
cursor_theme = Nordzy-cursors
cursor_size = 24

# Multi-monitor and Tags
focus_cross_monitor = 1 # Allow directional focus to cross monitor boundaries
exchange_cross_monitor = 1 # Allow exchanging clients across monitor boundaries
focus_cross_tag = 1 # Allow directional focus to cross into other tags
# view_current_to_back = 0 # Toggling the current tag switches back to the previously viewed tag
# scratchpad_cross_monitor = 1 # Share the scratchpad pool across all monitors
# single_scratchpad = 0 # Only allow one scratchpad (named or standard) to be visible at a time
# circle_layout = scroller,tile # A comma-separated list of layouts switch_layout cycles through

# Window Behavior
# enable_floating_snap = 0 # Snap floating windows to edges or other windows.
# snap_distance = 30 # Max distance (pixels) to trigger floating snap.
# no_border_when_single = 0 # Remove window borders when only one window is visible on the tag.
# idleinhibit_ignore_visible = 0 # Allow invisible clients (e.g., background audio players) to inhibit idle.


# reload config
bind=SUPER+CTRL,R,reload_config

# menu and terminal
bind=SUPER,Space,spawn,nc -U /run/user/1000/walker/walker.sock
bind=SUPER,Return,spawn,kitty
bind=SUPER,B,spawn,~/.config/hypr/scripts/launch-browser

# exit
bind=SUPER,Delete,quit
bind=SUPER,C,killclient

# switch window focus
bind=SUPER,H,focusdir,left
bind=SUPER,J,focusdir,down
bind=SUPER,K,focusdir,up
bind=SUPER,L,focusdir,right
bind=SUPER,Tab,toggleoverview
bind=ALT,Tab,focusstack,next

# swap window
bind=SUPER+SHIFT,H,exchange_client,left
bind=SUPER+SHIFT,J,exchange_client,down
bind=SUPER+SHIFT,K,exchange_client,up
bind=SUPER+SHIFT,L,exchange_client,right

# switch window status
bind=SUPER,P,toggleglobal,
bind=SUPER,T,togglefloating,
bind=SUPER,F,togglemaximizescreen,
bind=SUPER+ALT,F,togglefullscreen,
bind=SUPER+CTRL,F,togglefakefullscreen,
# bind=SUPER,i,minimized,
# bind=SUPER,o,toggleoverlay,
# bind=SUPER+SHIFT,I,restore_minimized
# bind=SUPER,Z,toggle_scratchpad

bind=SUPER,R,switch_proportion_preset

bind=SUPER+ALT,R,setkeymode,resize
keymode=resize
bindl=NONE,H,resizewin,-30,+0
bindl=NONE,J,resizewin,+0,+30
bindl=NONE,K,resizewin,+0,-30
bindl=NONE,L,resizewin,+30,+0
bind=NONE,Escape,setkeymode,default


# switch layout
bind=SUPER,N,switch_layout

bind = SUPER,U,viewtoright
bind = SUPER,I,viewtoleft

# Mouse Button Bindings
# NONE mode key only work in ov mode
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=NONE,btn_left,toggleoverview,1
mousebind=NONE,btn_right,killclient,0

# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client
