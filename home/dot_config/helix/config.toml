theme = "onenord"

[editor]
  line-number             = "relative"
  cursorline              = true
  bufferline              = "multiple"
  color-modes             = true
  end-of-line-diagnostics = 'hint'

  [editor.cursor-shape]
    insert = "bar"
    normal = "block"
    select = "underline"

  [editor.statusline]
    left = [
      "mode",
      "version-control",
      "spinner",
      "file-name",
      "read-only-indicator",
      "file-modification-indicator",
    ]
    right = [
      "diagnostics",
      "selections",
      "register",
      "position-percentage",
      "separator",
      "position",
      "file-encoding",
    ]
    separator = " |"
    mode.normal = "NORMAL"
    mode.insert = "INSERT"
    mode.select = "SELECT"

  [editor.lsp]
    display-inlay-hints = true

  [editor.file-picker]
    hidden = false

  [editor.indent-guides]
    render      = true
    skip-levels = 1
    # character="▏"

    # [keys.insert]
    #   j = { k = "normal_mode" }

[keys.normal]
  x       = "extend_line"
  "}"     = "goto_next_paragraph"
  "{"     = "goto_prev_paragraph"
  "C-q"   = ":quit"
  "C-s"   = ":write"
  "C-S-s" = "save_selection"
  C-r     = ":config-reload"
  A-c     = ":buffer-close"
  A-h     = ":buffer-previous"
  A-l     = ":buffer-next"
  # tab     = "move_parent_node_end"
  # S-tab   = "move_parent_node_start"

[keys.select]
  x       = "extend_line"
  "}"     = "goto_next_paragraph"
  "{"     = "goto_prev_paragraph"
  "C-q"   = ":quit"
  "C-s"   = ":write"
  "C-S-s" = "save_selection"
  C-r     = ":config-reload"
  A-c     = ":buffer-close"
  A-h     = ":buffer-previous"
  A-l     = ":buffer-next"
  # tab   = "extend_parent_node_end"
  # S-tab = "extend_parent_node_start"
