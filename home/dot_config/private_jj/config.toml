#:schema https://docs.jj-vcs.dev/latest/config-schema.json

[user]
  name  = "Kevin McNamara"
  email = "kevin.j.mcnamara+tech@proton.me"

[ui]
  editor = "nvim"
  # diff-editor  = "neovim"
  # merge-editor = "neovim"
  # diff-formatter = "neovim"
  # diff-formatter = ":git"
  # diff-formatter = "difftastic"
  color = "always"
  # pager = [
  #   "delta",
  #   "--syntax-theme=Nord",
  #   "--navigate",
  #   "--side-by-side",
  #   "--dark",
  # ]

[colors]
  "diff token"   = { reverse = true, underline = false }
  "diff context" = { dim = true }

[merge-tools.difftastic]
  program   = "difft"
  diff-args = ["--color=always", "$left", "$right"]

[merge-tools.neovim]
  program              = "nvim"
  diff-args            = ["-d", "$left", "$right"]
  edit-args            = ["-d", "$left", "$right"]
  merge-args           = ["-d", "$left", "$base", "$right", "$output", "-c", "wincmd J"]
  diff-invocation-mode = "file-by-file"

[merge-tools.diffview]
  program = "nvim"
  args    = ["-n", "-c", "DiffviewOpen", "$output"]

[git]
  default-branch = "main"
  # push-bookmark-prefix = "kjm-"

[template-aliases]
  'format_timestamp(timestamp)' = 'timestamp.ago()'
