# Autostart
# exec-once = uwsm-app -- waypaper --restore --no-post-command # will implicitly run hyprpaper

# Window Rule
windowrule = match:class waypaper, float on, center on, size 800 650

# Keybinds
bindd = SUPER CTRL, W, Launch wallpaper selector, exec, uwsm-app -- waypaper --no-post-command
